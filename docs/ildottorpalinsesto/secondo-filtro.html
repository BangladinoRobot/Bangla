<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Secondo filtro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="btn" href="index.html">🏠 Home</a>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="primo-filtro.html">Primo filtro</a>
        <a class="btn" href="campionati.html">Campionati</a>
        <a class="btn" href="archivio.html">Archivio</a>
      </div>
    </div>

    <div class="hero" style="margin-top:14px">
      <h1 style="font-size:24px">Secondo filtro</h1>
      <div class="sub">Partite future che passano il filtro quote (registro: passed_fixtures_stats.json)</div>
    </div>

    <input id="q" class="search" placeholder="Cerca (squadra, campionato, paese)..." />

    <div class="hr"></div>
    <div id="out"></div>

    <div style="margin-top:12px">
      <a class="btn" href="archivio.html">Guarda l’archivio delle partite filtrate</a>
    </div>
  </div>

<script src="assets/app.js"></script>
<script>
function qp(name){
  const u = new URL(location.href);
  return u.searchParams.get(name);
}
window.addEventListener("DOMContentLoaded", async ()=>{
  const passedSecond = await fetchJson("passed_fixtures_stats.json");
  const all = toArr(passedSecond);

  const leagueFilter = qp("league");
  let items = all.filter(x=>x && isUpcoming(x.fixture_date));
  if(leagueFilter){
    const lf = norm(leagueFilter);
    items = items.filter(x=> norm((x.league_country||"") + " - " + (x.league_name||"")).includes(lf));
  }

  const out = document.getElementById("out");
  const q = document.getElementById("q");

  function redraw(){
    const qq = norm(q.value.trim());
    const filtered = items.filter(x=>matchQuery(x, qq));
    renderRows(out, filtered, (x)=>`fixture.html?id=${encodeURIComponent(x.fixture_id)}&src=second`);
  }
  q.addEventListener("input", redraw);
  redraw();
});
</script>
</body>
</html>
