<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Archivio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="btn" href="index.html">🏠 Home</a>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="primo-filtro.html">Primo filtro</a>
        <a class="btn" href="secondo-filtro.html">Secondo filtro</a>
        <a class="btn" href="campionati.html">Campionati</a>
      </div>
    </div>

    <div class="hero" style="margin-top:14px">
      <h1 style="font-size:24px">Archivio</h1>
      <div class="sub">Storico delle partite filtrate (con ricerca). Quote e risultati: predisposto.</div>
    </div>

    <div class="grid two">
      <a class="card card-click" id="tabFirst" href="#" onclick="setTab('first');return false;">
        <div class="pill">Archivio Primo filtro</div>
        <div class="label">Tutte le partite che hanno passato 7/14</div>
      </a>
      <a class="card card-click" id="tabSecond" href="#" onclick="setTab('second');return false;">
        <div class="pill">Archivio Secondo filtro</div>
        <div class="label">Tutte le partite che hanno passato il filtro quote</div>
      </a>
    </div>

    <div style="margin-top:12px">
      <input id="q" class="search" placeholder="Cerca (squadra, campionato, paese)..." />
    </div>

    <div class="hr"></div>
    <div id="out"></div>
  </div>

<script src="assets/app.js"></script>
<script>
let ALL_FIRST = [];
let ALL_SECOND = [];
let TAB = "first";

function setTab(t){
  TAB = t;
  document.getElementById("tabFirst").style.opacity = (t==="first" ? "1" : ".7");
  document.getElementById("tabSecond").style.opacity = (t==="second" ? "1" : ".7");
  redraw();
}
function redraw(){
  const out = document.getElementById("out");
  const q = norm(document.getElementById("q").value.trim());
  const items = (TAB==="first" ? ALL_FIRST : ALL_SECOND).filter(x=>matchQuery(x,q));
  renderRows(out, items, (x)=>`fixture.html?id=${encodeURIComponent(x.fixture_id)}&src=${TAB}`);
}
window.addEventListener("DOMContentLoaded", async ()=>{
  const statsChecked = await fetchJson("stats_checked.json");
  const passedSecond = await fetchJson("passed_fixtures_stats.json");

  ALL_FIRST = toArr(statsChecked).filter(x=>x && x.passes_7_on_14===true);
  ALL_SECOND = toArr(passedSecond);

  document.getElementById("q").addEventListener("input", redraw);
  setTab("first");
});
</script>
</body>
</html>
