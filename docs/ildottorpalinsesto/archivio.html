<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivio • il Dottor Palinsesto</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; margin:0; background:#12061b; color:#f3e9ff}
a{color:#caa6ff} .wrap{max-width:980px;margin:0 auto;padding:22px}
.h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 12px;border-radius:12px;background:#2b1140;color:#fff;text-decoration:none}
.card{background:#1a0928;border:1px solid #3a1754;border-radius:16px;padding:14px;margin-top:14px}
.small{opacity:.85;font-size:14px}
.row{padding:10px 0;border-bottom:1px solid rgba(202,166,255,.15)}
.row:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#3a1754;margin-left:8px;font-size:12px}
</style>
</head><body><div class="wrap">
<div class="h">
  <div>
    <h1 style="margin:0">Archivio partite filtrate</h1>
    <div class="small">Storico primo filtro + secondo filtro (quote).</div>
  </div>
  <div>
    <a class="btn" href="./index.html#metodo-00migliorato">⬅︎ Home</a>
    <a class="btn" href="./calendario.html">📅 Calendario</a>
  </div>
</div>

<div class="card">
  <div id="meta" class="small"></div>
  <div id="list"></div>
</div>

<script>
(async function(){
  const meta = document.getElementById("meta");
  const list = document.getElementById("list");
  try{
    const m = await (await fetch("./data/run_meta.json?ts="+Date.now())).json();
    const f1 = await (await fetch("./data/archive_filter1.json?ts="+Date.now())).json();
    const f2 = await (await fetch("./data/archive_filter2.json?ts="+Date.now())).json();

    const f2set = new Map();
    f2.forEach(x=>f2set.set(String(x.fixture_id), x));

    meta.textContent = `Generato: ${m.generated_at_utc} • Primo filtro: ${f1.length} • Secondo filtro: ${f2.length}`;
    list.innerHTML = "";

    f1.slice().reverse().forEach(it=>{
      const d = it.fixture_date ? new Date(it.fixture_date).toLocaleString("it-IT") : "?";
      const o = f2set.get(String(it.fixture_id));
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `<b>${it.home_name} vs ${it.away_name}</b> <span class="badge">${it.total_0_0_1_1}/14</span><br>
        <span class="small">${it.league_country} • ${it.league_name} • ${d}</span><br>
        <span class="small">Quote: ${o ? ("X "+o.draw_price+" • U2.5 "+o.under25_price+" ("+o.bookmaker+")") : "(non disponibili)"} • Risultato finale: (da aggiungere)</span>`;
      list.appendChild(div);
    });

    if(!f1.length) list.innerHTML = "<div class='row'>Nessun dato in archivio.</div>";
  }catch(e){
    meta.textContent = "Impossibile caricare i dati.";
  }
})();
</script>
</div></body></html>
