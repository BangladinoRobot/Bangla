<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primo filtro • il Dottor Palinsesto</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; margin:0; background:#12061b; color:#f3e9ff}
a{color:#caa6ff} .wrap{max-width:980px;margin:0 auto;padding:22px}
.h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 12px;border-radius:12px;background:#2b1140;color:#fff;text-decoration:none}
.card{background:#1a0928;border:1px solid #3a1754;border-radius:16px;padding:14px;margin-top:14px}
.small{opacity:.85;font-size:14px} ul{margin:10px 0 0;padding-left:18px}
li{margin:6px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#3a1754;margin-left:8px;font-size:12px}
</style>
</head><body><div class="wrap">
<div class="h">
  <div>
    <h1 style="margin:0">Primo filtro</h1>
    <div class="small">Partite che passano il filtro 7/14 (ultima analisi).</div>
  </div>
  <div>
    <a class="btn" href="./index.html#metodo-00migliorato">⬅︎ Home</a>
    <a class="btn" href="./calendario.html">📅 Calendario</a>
    <a class="btn" href="./archivio.html">🗃 Archivio</a>
  </div>
</div>

<div class="card">
  <div id="meta" class="small"></div>
  <ul id="list"></ul>
</div>

<script>
(async function(){
  const meta = document.getElementById("meta");
  const ul = document.getElementById("list");
  try{
    const m = await (await fetch("./data/run_meta.json?ts="+Date.now())).json();
    const data = await (await fetch("./data/filter1_today.json?ts="+Date.now())).json();
    meta.textContent = `Generato: ${m.generated_at_utc} • Partite: ${data.length}`;
    ul.innerHTML = "";
    data.forEach(it=>{
      const d = it.fixture_date ? new Date(it.fixture_date).toLocaleString() : "?";
      const li = document.createElement("li");
      li.innerHTML = `<b>${it.home_name} vs ${it.away_name}</b> <span class="badge">${it.total_0_0_1_1}/14</span><br><span class="small">${it.league_country} • ${it.league_name} • ${d}</span>`;
      ul.appendChild(li);
    });
    if(!data.length) ul.innerHTML = "<li>Nessuna partita in primo filtro (ultima analisi).</li>";
  }catch(e){
    meta.textContent = "Impossibile caricare i dati.";
  }
})();
</script>
</div></body></html>
