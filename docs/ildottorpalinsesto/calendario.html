<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario • il Dottor Palinsesto</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; margin:0; background:#12061b; color:#f3e9ff}
a{color:#caa6ff} .wrap{max-width:980px;margin:0 auto;padding:22px}
.h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 12px;border-radius:12px;background:#2b1140;color:#fff;text-decoration:none}
.day{background:#1a0928;border:1px solid #3a1754;border-radius:16px;padding:14px;margin-top:14px}
.small{opacity:.85;font-size:14px}
.item{padding:10px 0;border-bottom:1px solid rgba(202,166,255,.15)}
.item:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#3a1754;margin-left:8px;font-size:12px}
</style>
  <!-- SOCCER_THEME_V1 -->
  <!-- SOCCER_THEME_FONT_V1 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head><body><div class="wrap">
<div class="h">
  <div>
    <h1 style="margin:0">Calendario (partite da giocare)</h1>
    <div class="small">Si aggiorna automaticamente quando cambia il giorno.</div>
  </div>
  <div>
    <a class="btn" href="./index.html#metodo-00migliorato">⬅︎ Home</a>
    <a class="btn" href="./archivio.html">🗃 Guarda l’archivio</a>
  </div>
</div>

<div id="meta" class="small" style="margin-top:10px"></div>
<div id="days"></div>

<script>
function keyDate(dt){ return dt.toISOString().slice(0,10); }
function fmtDate(dt){ return dt.toLocaleDateString("it-IT",{weekday:"long",year:"numeric",month:"long",day:"numeric"}); }
(async function(){
  const meta = document.getElementById("meta");
  const days = document.getElementById("days");
  try{
    const m = await (await fetch("./data/run_meta.json?ts="+Date.now())).json();
      const upcoming = await (await fetch("./data/calendar_upcoming.json?ts="+Date.now())).json();
      let data = Array.isArray(upcoming) ? upcoming.slice() : [];
      let pastAdded = 0;

      // aggiunge anche le PASSATE (ultimi 7 giorni) dal registry stats_checked.json
      try{
        const statsChecked = await (await fetch("stats_checked.json?ts="+Date.now())).json();
        const passedSecond = await (await fetch("passed_fixtures_stats.json?ts="+Date.now())).json();

        const passedMap = new Map();
        if (Array.isArray(passedSecond)) {
          for (const fx of passedSecond) {
            const fid = Number((fx && fx.fixture_id) ? fx.fixture_id : NaN);
            if (!Number.isNaN(fid)) passedMap.set(fid, fx);
          }
        }

        const now2 = new Date();
        const startPast = new Date(now2.getTime() - 7*24*60*60*1000);

        if (statsChecked && typeof statsChecked === "object") {
          for (const [k, e] of Object.entries(statsChecked)) {
            if (!e || typeof e !== "object") continue;
            const passFlag = (e.passes_7_on_14 ?? e.passes_7on14);
            if (passFlag !== true) continue;

            const fid = Number((e.fixture_id !== undefined && e.fixture_id !== null) ? e.fixture_id : k);
            if (Number.isNaN(fid)) continue;

            const fx = passedMap.get(fid);
            const merged = fx ? ({ ...e, ...fx, fixture_id: fid }) : ({ ...e, fixture_id: fid });

            const d = merged.fixture_date ? new Date(merged.fixture_date) : (merged.date ? new Date(merged.date) : null);
            if (!d || isNaN(d.getTime())) continue;
            if (d >= now2) continue;        // solo passate
            if (d < startPast) continue;    // limita ai 7 giorni

            // evita duplicati su fixture_id
            let dup = false;
            for (const x of data) {
              const xid = Number(x && x.fixture_id);
              if (!Number.isNaN(xid) && xid === fid) { dup = true; break; }
            }
            if (dup) continue;

            if (!merged.fixture_date && merged.date) merged.fixture_date = merged.date;

            data.push(merged);
            pastAdded += 1;
          }
        }
      }catch(e){}

      meta.textContent = `Generato: ${m.generated_at_utc} • Future (primo filtro): ${(Array.isArray(upcoming)?upcoming.length:0)} • Passate (ultimi 7g): ${pastAdded}`;
    // raggruppa per giorno locale del browser
    const groups = {};
    const today = new Date(); today.setHours(0,0,0,0);

    data.forEach(it=>{
      const d = it.fixture_date ? new Date(it.fixture_date) : null;
      if(!d) return;
        // NO_PAST_NONFT_V1: evita partite non giocate nel passato (rinvii/date stale)
        const st0 = (it.ft_status || it.status_short || it.fixture_status_short || "").toString().trim();
        const h0 = (it.ft_home ?? it.goals_home);
        const a0 = (it.ft_away ?? it.goals_away);
        const sc0 = it.ft_score || ((h0!==null && h0!==undefined && a0!==null && a0!==undefined) ? `${h0}-${a0}` : "");
        if (d < today && !sc0 && st0 !== "FT") return;

      const kd = keyDate(d);
      groups[kd] = groups[kd] || [];
      groups[kd].push(it);
    });

    const keys = Object.keys(groups).sort().reverse();
    days.innerHTML = "";
    if(!keys.length){
      days.innerHTML = `<div class="day"><b>Nessuna partita futura in primo filtro.</b></div>`;
      return;
    }

    keys.forEach(k=>{
      const list = groups[k].sort((a,b)=> (a.fixture_date||"").localeCompare(b.fixture_date||""));
      const dt = new Date(k+"T00:00:00");
      const box = document.createElement("div");
      box.className = "day";
      box.innerHTML = `<h2 style="margin:0 0 6px 0">${fmtDate(dt)}</h2>`;
      list.forEach(it=>{
        const t = it.fixture_date ? new Date(it.fixture_date).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) : "?";
        const div = document.createElement("div");
        div.className = "item";
        const h = (it.ft_home ?? it.goals_home);
        const a = (it.ft_away ?? it.goals_away);
        const score = it.ft_score || ((h!==null && h!==undefined && a!==null && a!==undefined) ? `${h}-${a}` : "");
        const st = (it.ft_status || it.status_short || it.fixture_status_short || "").toString().trim();
        let mark = (it.ft_mark || "").toString().trim();
        if (!mark && score) mark = (score === "0-0") ? "✅" : "❌";
        const ftLine = score ? `<span class="ft">${mark} FT ${score}${st ? " (" + st + ")" : ""}</span><br>` : "";
          div.innerHTML = `<b>${t} • ${it.home_name} vs ${it.away_name}</b> <span class="badge">${it.total_0_0_1_1}/14</span><br>${ftLine}
            <span class="small">${it.league_country} • ${it.league_name}</span><br>
            <span class="small">0-0/1-1 split: (pronto) • Quote: (placeholder)</span>`;
          box.appendChild(div);
      });
      days.appendChild(box);
    });
  }catch(e){
    meta.textContent = "Impossibile caricare i dati.";
  }
})();
</script>
</div></body></html>
