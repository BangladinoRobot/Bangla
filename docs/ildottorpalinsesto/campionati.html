<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Campionati</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="btn" href="index.html">🏠 Home</a>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="primo-filtro.html">Primo filtro</a>
        <a class="btn" href="secondo-filtro.html">Secondo filtro</a>
        <a class="btn" href="archivio.html">Archivio</a>
      </div>
    </div>

    <div class="hero" style="margin-top:14px">
      <h1 style="font-size:24px">Campionati</h1>
      <div class="sub">Lista campionati (cliccabili) + conteggi partite future per filtro</div>
    </div>

    <input id="q" class="search" placeholder="Cerca campionato o paese..." />

    <div class="hr"></div>
    <div id="out" class="rows"></div>
  </div>

<script src="assets/app.js"></script>
<script>
window.addEventListener("DOMContentLoaded", async ()=>{
  const statsChecked = await fetchJson("stats_checked.json");
  const passedSecond = await fetchJson("passed_fixtures_stats.json");

  const firstAll = toArr(statsChecked).filter(x=>x && x.passes_7_on_14===true && isUpcoming(x.fixture_date));
  const secondAll = toArr(passedSecond).filter(x=>x && isUpcoming(x.fixture_date));

  const map = new Map();
  function keyOf(x){
    const k = `${x.league_country||""} - ${x.league_name||""}`.trim();
    return k || "Sconosciuto";
  }
  for(const x of firstAll){
    const k = keyOf(x);
    const o = map.get(k) || {k, first:0, second:0};
    o.first += 1; map.set(k,o);
  }
  for(const x of secondAll){
    const k = keyOf(x);
    const o = map.get(k) || {k, first:0, second:0};
    o.second += 1; map.set(k,o);
  }

  const all = [...map.values()].sort((a,b)=> (b.first+b.second)-(a.first+a.second) || a.k.localeCompare(b.k));
  const out = document.getElementById("out");
  const q = document.getElementById("q");

  function redraw(){
    const qq = norm(q.value.trim());
    out.innerHTML = "";
    const filtered = all.filter(x=> norm(x.k).includes(qq));
    if(!filtered.length){
      out.appendChild(el("div","muted","Nessun campionato trovato."));
      return;
    }
    for(const x of filtered){
      const league = x.k;
      const a = el("a","row");
      const enc = encodeURIComponent(league);
      a.href = `primo-filtro.html?league=${enc}`;
      a.innerHTML = `
        <div class="row-top">
          <div class="row-title">🏟 ${league}</div>
          <div class="pill">1º: ${x.first} • 2º: ${x.second}</div>
        </div>
        <div class="row-meta">Tocca: apre il Primo filtro già filtrato su questo campionato. (In alto puoi passare al Secondo filtro)</div>
      `;
      out.appendChild(a);
    }
  }
  q.addEventListener("input", redraw);
  redraw();
});
</script>
</body>
</html>
