<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Il Dottor Palinsesto — Campionati analizzati</title>
  <style>
    :root{
      --bg:#07060b; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.04);
      --txt:#f2f1f6; --muted:rgba(242,241,246,.65);
      --border:rgba(255,255,255,.10); --accent:#a855f7;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 600px at 30% 0%, rgba(168,85,247,.25), transparent 55%),
        radial-gradient(900px 500px at 80% 30%, rgba(99,102,241,.18), transparent 60%),
        var(--bg);
      color:var(--txt);
      min-height:100vh;
      padding:24px 16px 48px;
    }
    .wrap{max-width:860px;margin:0 auto}
    h1{margin:0 0 6px;font-size:40px;letter-spacing:.2px}
    .sub{color:var(--muted);margin:0 0 18px;font-size:16px}
    .nav{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      margin:14px 0 18px;
    }
    a.btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(168,85,247,.20), rgba(168,85,247,.08));
      color:var(--txt);text-decoration:none;font-weight:600;
    }
    a.btn:hover{border-color:rgba(168,85,247,.55)}
    .card{
      border:1px solid var(--border);
      background:linear-gradient(180deg, var(--card), var(--card2));
      border-radius:18px;
      padding:16px;
      box-shadow:0 12px 28px rgba(0,0,0,.35);
    }
    .card h2{margin:0 0 8px;font-size:22px}
    .meta{color:var(--muted);font-size:14px;margin:0 0 12px}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.25);
      color:var(--txt);
      font-weight:700;
      margin:8px 0 14px;
    }
    ul{margin:0;padding-left:18px;line-height:1.55}
    li{margin:4px 0}
    .err{color:#ffb4b4}
  </style>
</head>
<body>
  <div class="wrap" id="metodo-00migliorato">
    <h1>Il Dottor Palinsesto</h1>
    <p class="sub">Pagina dettaglio — Campionati analizzati (Metodo 0-0 migliorato)</p>

    <div class="nav">
      <a class="btn" href="./index.html#metodo-00migliorato">← Torna alla dashboard</a>
    </div>

    <div class="card">
      <h2>Campionati analizzati</h2>
      <p class="meta" id="updated">Caricamento...</p>

      <div class="pill" id="countPill">Campionati: …</div>

      <div id="content"></div>
    </div>
  </div>

  <script>
    async function main(){
      const updated = document.getElementById('updated');
      const content = document.getElementById('content');
      const countPill = document.getElementById('countPill');

      try{
        const res = await fetch('./stats_summary.json?v=' + Date.now(), {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        const leagues = Array.isArray(data.leagues) ? data.leagues : [];
        const dtMin = data.date_min || '';
        const dtMax = data.date_max || '';
        const tot = (typeof data.total_fixtures === 'number') ? data.total_fixtures : (data.total_fixtures||'');

        updated.textContent = `Intervallo: ${dtMin} → ${dtMax} — Partite analizzate: ${tot}`;
        countPill.textContent = `Campionati: ${leagues.length}`;

        if(leagues.length === 0){
          content.innerHTML = '<p class="meta">Nessun campionato disponibile per questo aggiornamento.</p>';
          return;
        }

        const ul = document.createElement('ul');
        leagues.forEach(x => {
          const li = document.createElement('li');
          li.textContent = x;
          ul.appendChild(li);
        });
        content.innerHTML = '';
        content.appendChild(ul);

      }catch(e){
        updated.innerHTML = '<span class="err">Errore nel caricare stats_summary.json</span>';
        content.innerHTML = '<p class="meta">Controlla che GitHub Pages stia servendo anche stats_summary.json nella stessa cartella.</p>';
        countPill.textContent = 'Campionati: ?';
        console.error(e);
      }
    }
    main();
  </script>
</body>
</html>
