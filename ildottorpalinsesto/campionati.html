<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campionati analizzati - Metodo 0-0 migliorato</title>
  <!-- CAMPIONATI_PAGE_MARK_V1 -->
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap{max-width:980px;margin:0 auto;padding:18px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
    .btn{display:inline-block;padding:10px 14px;border-radius:14px;text-decoration:none;border:1px solid rgba(255,255,255,.18);}
    .panel{border-radius:22px;padding:16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);}
    .meta{opacity:.85;font-size:14px;margin:6px 0 10px;}
    ul{margin:0;padding-left:18px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 style="margin:0;">Campionati analizzati</h1>
        <div class="meta" id="meta-sub">Metodo 0-0 migliorato</div>
      </div>
      <a class="btn" href="index.html#metodo-00migliorato">← Torna alla dashboard</a>
    </div>

    <div class="panel" id="metodo-00migliorato">
      <div class="meta" id="meta-range">Caricamento…</div>
      <div class="meta" id="meta-count"></div>
      <ul id="list"></ul>
    </div>
  </div>

  <script>
  (async function(){
    const metaRange = document.getElementById("meta-range");
    const metaCount = document.getElementById("meta-count");
    const ul = document.getElementById("list");
    try{
      const res = await fetch("stats_summary.json?ts=" + Date.now());
      const data = await res.json();
      const leagues = Array.isArray(data.leagues) ? data.leagues : [];
      const dmin = data.date_min || "";
      const dmax = data.date_max || "";
      if(dmin && dmax) {
        metaRange.textContent = "Periodo analizzato: " + dmin + " → " + dmax;
      } else {
        metaRange.textContent = "Periodo analizzato: (dato non disponibile)";
      }
      metaCount.textContent = "Campionati analizzati (" + leagues.length + "):";
      ul.innerHTML = "";
      leagues.forEach(lg => {
        const li = document.createElement("li");
        li.textContent = lg;
        ul.appendChild(li);
      });
      if(leagues.length === 0) {
        metaCount.textContent = "Nessun campionato analizzato per questo aggiornamento.";
      }
    } catch(e) {
      metaRange.textContent = "Impossibile caricare stats_summary.json.";
      metaCount.textContent = "";
      ul.innerHTML = "";
    }
  })();
  </script>
</body>
</html>
