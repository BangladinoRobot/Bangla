<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filtro 1 • il Dottor Palinsesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head><body>
<header class="topnav"><div class="inner">
  <div class="brand">il Dottor Palinsesto</div>
  <nav class="links">
    <a href="./index.html">⚽</a>
    <a class="active" href="./filtro1.html">Filtro 1</a>
    <a href="./filtro2.html">Filtro 2</a>
    <a href="./archivio.html">Archivio</a>
  </nav>
</div></header>

<main class="wrap">
  <h1 style="margin:0 0 6px">Filtro 1</h1>
  <div class="small">Partite che passano 7/14 (0-0 / 1-1). Tab Archivio: solo GIÀ DISPUTATE.</div>

  <div class="tabs">
    <button id="tab-up" class="tab">Da oggi in poi</button>
    <button id="tab-ar" class="tab">Archivio</button>
  </div>

  <input id="q" class="input" placeholder="Cerca (squadra o campionato)…">

  <div class="card" style="margin-top:12px">
    <div id="meta" class="small"></div>
    <div id="pager" class="small" style="margin-top:10px; display:none"></div>
    <ul id="list" style="margin:10px 0 0; padding-left:18px"></ul>
  </div>
</main>

<script>
const $ = (id)=>document.getElementById(id);
const tabUp = $("tab-up"), tabAr = $("tab-ar");
const q = $("q"), meta = $("meta"), ul = $("list"), pager = $("pager");

function utcDayKey(iso){
  const d = new Date(iso);
  return d.toISOString().slice(0,10);
}
function fmt(iso){
  try{ return new Date(iso).toLocaleString(); }catch(e){ return iso || "?"; }
}
function textOf(it){
  return `${it.home_name||""} ${it.away_name||""} ${it.league_country||""} ${it.league_name||""}`.toLowerCase();
}

async function loadJSON(path){
  return await (await fetch(path + "?ts=" + Date.now())).json();
}

function setActive(mode){
  const isArchive = mode === "archivio";
  tabUp.classList.toggle("active", !isArchive);
  tabAr.classList.toggle("active", isArchive);
  pager.style.display = isArchive ? "block" : "none";
}

function renderList(items){
  const needle = (q.value||"").trim().toLowerCase();
  const filtered = needle ? items.filter(it=>textOf(it).includes(needle)) : items;

  ul.innerHTML = "";
  if(!filtered.length){
    ul.innerHTML = "<li>Nessuna partita idonea.</li>";
    return;
  }
  for(const it of filtered){
    const d = fmt(it.fixture_date);
    const badge = `<span class="badge">${it.total_0_0_1_1}/14</span>`;
    const li = document.createElement("li");
    li.innerHTML = `<b>${it.home_name} vs ${it.away_name}</b> ${badge}<br><span class="small">${it.league_country||""} • ${it.league_name||""} • ${d}</span>`;
    ul.appendChild(li);
  }
}

(async function(){
  const mode = (location.hash === "#archivio") ? "archivio" : "upcoming";
  setActive(mode);

  let runMeta = null;
  try{ runMeta = await loadJSON("./data/run_meta.json"); }catch(e){}

  if(mode === "upcoming"){
    let data = [];
    try{ data = await loadJSON("./data/filter1_upcoming.json"); }catch(e){}
    meta.textContent = runMeta
      ? `Generato: ${runMeta.generated_at_utc} • Partite (da oggi): ${data.length}`
      : `Partite (da oggi): ${data.length}`;
    renderList(data);
    q.addEventListener("input", ()=>renderList(data));
    tabAr.onclick = ()=>{ location.hash = "#archivio"; location.reload(); };
    tabUp.onclick = ()=>{};
    return;
  }

  // ARCHIVIO (per giorno)
  let data = [];
  try{ data = await loadJSON("./data/archive_filter1.json"); }catch(e){}
  const days = Array.from(new Set(data.map(it=>utcDayKey(it.fixture_date)))).sort().reverse();
  let curDay = days[0] || null;

  // UI pager: calendario + prev/next
  pager.innerHTML = `
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px">
      <button id="prev" class="tab">← Giorno precedente</button>
      <button id="next" class="tab">Giorno successivo →</button>
      <label class="small">Data:
        <input id="cal" type="date" class="input" style="width:auto; padding:8px 10px; margin-left:6px">
      </label>
      <span id="dayinfo" class="small"></span>
    </div>
  `;

  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const cal = document.getElementById("cal");
  const dayinfo = document.getElementById("dayinfo");

  function setDay(d){
    curDay = d;
    cal.value = curDay || "";
    const idx = days.indexOf(curDay);
    prev.disabled = idx === -1 || idx === days.length-1;
    next.disabled = idx <= 0;
    const dayItems = data.filter(it=>utcDayKey(it.fixture_date)===curDay);
    meta.textContent = runMeta
      ? `Generato: ${runMeta.generated_at_utc} • Archivio • Giorno: ${curDay} • Partite: ${dayItems.length}`
      : `Archivio • Giorno: ${curDay} • Partite: ${dayItems.length}`;
    dayinfo.textContent = days.length ? `(${idx+1}/${days.length})` : "";
    renderList(dayItems);
    q.oninput = ()=>renderList(dayItems);
  }

  prev.onclick = ()=>{
    const idx = days.indexOf(curDay);
    if(idx >= 0 && idx < days.length-1) setDay(days[idx+1]);
  };
  next.onclick = ()=>{
    const idx = days.indexOf(curDay);
    if(idx > 0) setDay(days[idx-1]);
  };
  cal.onchange = ()=>{
    const d = cal.value;
    if(!d){ return; }
    if(days.includes(d)) setDay(d);
    else{
      meta.textContent = `Archivio • Giorno: ${d} • Partite: 0`;
      ul.innerHTML = "<li>Nessuna partita idonea per questo giorno.</li>";
    }
  };

  tabUp.onclick = ()=>{ location.hash = ""; location.reload(); };
  tabAr.onclick = ()=>{};
  setDay(curDay);
})();
</script>
</body></html>
